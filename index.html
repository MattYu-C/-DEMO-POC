<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>錠嵂保險經紀人 · 產險數位化作業平台</title>
<style>
:root{
  --ink:#0E1B2A; --ink-2:#33475C; --ink-3:#6B7F94;
  --line:#DCE4EC; --line-2:#EDF2F6;
  --canvas:#F1F5F9; --surface:#FFFFFF;
  --brand:#1B4D8F; --brand-soft:#EAF1FA; --brand-deep:#123765;
  --auto:#C97A12; --auto-soft:#FDF3E3;
  --ok:#177A5B; --ok-soft:#E7F4EF;
  --bad:#B3392C; --bad-soft:#FBEDEB;
  --r:6px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:0 18px;height:52px;background:var(--ink);color:#fff;flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:.02em}
.brand .zh{font-size:16px}
.brand .en{font-size:10px;opacity:.55;letter-spacing:.14em;font-weight:500}
.brand-div{width:1px;height:18px;background:rgba(255,255,255,.2)}
.brand .sys{font-size:12.5px;font-weight:400;opacity:.8}
.topbar .sp{flex:1}
.rolesw{display:flex;background:rgba(255,255,255,.09);border-radius:var(--r);padding:2px}
.rolesw button{padding:5px 13px;font-size:12.5px;border-radius:4px;color:rgba(255,255,255,.6);white-space:nowrap;transition:.15s}
.rolesw button:hover{color:#fff}
.rolesw button.on{background:#fff;color:var(--ink);font-weight:600}
.ghost{padding:5px 12px;font-size:12.5px;border:1px solid rgba(255,255,255,.22);border-radius:var(--r);color:rgba(255,255,255,.75)}
.ghost:hover{border-color:rgba(255,255,255,.5);color:#fff}
.tenant{font-size:10.5px;padding:3px 7px;border:1px solid rgba(255,255,255,.22);border-radius:3px;opacity:.6;letter-spacing:.04em}

/* ---------- state rail (signature element) ---------- */
.topnav{display:flex;align-items:center;gap:2px;padding:0 14px;height:44px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}
.topnav .grp{font-size:10px;letter-spacing:.1em;color:var(--ink-3);font-weight:700;padding:0 12px 0 2px;flex-shrink:0;white-space:nowrap}
.topnav a{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;font-size:13px;color:var(--ink-2);
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0}
.topnav a:hover{background:var(--line-2)}
.topnav a.on{background:var(--brand-soft);color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.topnav .ic{font-size:12px;opacity:.7}

.rail-head h3{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-bottom:3px}
.caseno{font-family:var(--mono);font-size:11px;color:var(--ink-2);display:block;margin-bottom:12px}
.rail-track{display:flex;flex-direction:column}
.st{position:relative;padding:7px 0 7px 15px;border-left:3px solid var(--line);transition:background .12s}
.st:hover{background:var(--line-2)}
.st .n{font-family:var(--mono);font-size:9px;color:var(--ink-3);display:block;line-height:1.2}
.st .l{font-size:11px;color:var(--ink-3);white-space:nowrap;line-height:1.35}
.st.done{border-left-color:var(--brand)}
.st.done .l{color:var(--ink-2)}
.st.now{border-left-color:var(--auto)}
.st.now .l{color:var(--auto);font-weight:700}
.st.now .n{color:var(--auto)}
.st.now::after{content:"";position:absolute;left:-3px;top:0;bottom:0;width:3px;background:var(--auto);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.st.rej{border-left-color:var(--bad)}
.st.rej .l,.st.rej .n{color:var(--bad);font-weight:700}

/* ---------- body ---------- */
.wrap{flex:1;display:flex;overflow:hidden}
.rail{width:196px;background:var(--surface);border-right:1px solid var(--line);flex-shrink:0;
  padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;padding:20px 24px 60px}
.inner{max-width:940px;margin:0 auto}

/* ---------- primitives ---------- */
.ph{margin-bottom:16px}
.ph .eyebrow{font-size:10.5px;letter-spacing:.1em;color:var(--auto);font-weight:700;margin-bottom:3px}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph p{font-size:13px;color:var(--ink-3);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.card>h2{font-size:13.5px;font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.card>h2 .tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--brand-soft);color:var(--brand);letter-spacing:.03em}
.card .bd{padding:16px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.req{color:var(--bad);margin-left:2px}
.f input,.f select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#fff}
.f input:disabled{background:var(--line-2);color:var(--ink-2)}
.f.pre input,.f.pre select{background:var(--brand-soft);border-color:#C5D8EE}
.hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.hint.auto{color:var(--auto)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;background:var(--brand);color:#fff;border-radius:var(--r);font-weight:600;font-size:13.5px;transition:.15s}
.btn:hover{background:var(--brand-deep)}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.g{background:var(--ok)} .btn.g:hover{background:#0F5B43}
.btn.r{background:var(--bad)} .btn.r:hover{background:#8E2C21}
.btn.o{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.o:hover{background:var(--brand-soft)}
.btn.sm{padding:6px 13px;font-size:12.5px}
.acts{display:flex;gap:9px;align-items:center;margin-top:16px;flex-wrap:wrap}
.note{padding:11px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.65;margin-bottom:13px}
.note.a{background:var(--auto-soft);border-left:3px solid var(--auto)}
.note.b{background:var(--brand-soft);border-left:3px solid var(--brand)}
.note.r{background:var(--bad-soft);border-left:3px solid var(--bad)}
.note.k{background:var(--ok-soft);border-left:3px solid var(--ok)}
.note b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--line-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 0}
.chkr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:5px 0;border-bottom:1px dotted var(--line-2)}
.chkr .t{flex:1}
.bx{width:13px;height:13px;border:1.5px solid var(--ink-3);border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;line-height:1}
.bx.on{background:var(--brand);border-color:var(--brand)}
.chk.on{color:var(--ink);font-weight:600}
.chk.off{color:var(--ink-3)}

/* ---------- timer ---------- */
.clock{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:var(--r);padding:11px 16px;margin-bottom:14px}
.clock .lbl{font-size:10.5px;letter-spacing:.08em;opacity:.55;display:block;margin-bottom:1px}
.clock .v{font-family:var(--mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.clock .old .v{opacity:.42;font-size:15px;text-decoration:line-through;text-decoration-thickness:1px}
.clock .new .v{color:#F2B155}
.clock .x{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:700;color:#F2B155}
.clock .x small{font-size:10px;opacity:.6;display:block;letter-spacing:.08em;text-align:right;font-family:var(--sans);font-weight:500}

/* ---------- engine run ---------- */
.eng{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:13px}
.eng-h{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--auto-soft);border-bottom:1px solid #F0DFC0}
.eng-h .badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;background:var(--auto);color:#fff;padding:2px 7px;border-radius:3px}
.eng-h .nm{font-size:12.5px;font-weight:700;color:var(--auto)}
.eng-h .st{font-size:11.5px;color:var(--ink-3);margin-left:auto;font-family:var(--mono)}
.log{padding:10px 14px;background:#fff;max-height:230px;overflow-y:auto}
.ln{display:flex;gap:9px;font-size:12px;padding:3px 0;opacity:0;animation:fin .3s forwards}
@keyframes fin{to{opacity:1}}
.ln .t{font-family:var(--mono);color:var(--ink-3);font-size:11px;flex-shrink:0;width:44px}
.ln .m{color:var(--ink-2)}
.ln.ok .m{color:var(--ok);font-weight:600}
.ln .who{font-size:10.5px;padding:0 5px;border-radius:2px;background:var(--line-2);color:var(--ink-3);flex-shrink:0;align-self:center}
.bar{height:3px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--auto);width:0;transition:width .3s linear}

/* ---------- ocr compare ---------- */
.ocr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.ocr{grid-template-columns:1fr}}
.doc{border:1px solid var(--line);border-radius:var(--r);background:#FAFCFD;padding:13px;font-size:11.5px}
.doc .dt{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-bottom:9px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.dl{display:flex;justify-content:space-between;gap:10px;padding:5px 6px;border-radius:3px;transition:.2s}
.dl.hi{background:#FFF6E3}
.dl .k{color:var(--ink-3)}
.dl .v{font-weight:600;font-family:var(--mono);font-size:11px}
.conf{font-size:10px;font-family:var(--mono);padding:1px 5px;border-radius:2px;margin-left:6px}
.conf.h{background:var(--ok-soft);color:var(--ok)}
.conf.l{background:var(--bad-soft);color:var(--bad)}

/* ---------- quotes ---------- */
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.qs{grid-template-columns:1fr}}
.q{border:1.5px solid var(--line);border-radius:var(--r);padding:15px;background:#fff;cursor:pointer;transition:.15s;position:relative}
.q:hover{border-color:var(--brand);transform:translateY(-1px)}
.q.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(27,77,143,.09)}
.q .co{font-size:14px;font-weight:700;margin-bottom:2px}
.q .lo{font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;margin-bottom:11px}
.q .li{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--ink-2)}
.q .li .num{font-weight:600}
.q .tot{border-top:1px solid var(--line);margin-top:9px;padding-top:9px;display:flex;justify-content:space-between;align-items:baseline}
.q .tot span{font-size:11.5px;color:var(--ink-3)}
.q .tot b{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.q .flag{position:absolute;top:-8px;right:11px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--ok);color:#fff}

/* ---------- tracks ---------- */
.tks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
@media(max-width:820px){.tks{grid-template-columns:1fr}}
.tk{border:1.5px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;background:#fff;transition:.15s;display:flex;flex-direction:column}
.tk:hover{border-color:var(--brand)}
.tk.sel{border-color:var(--brand);background:var(--brand-soft)}
.tk .id{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--brand);line-height:1}
.tk h4{font-size:13.5px;margin:7px 0 4px}
.tk .d{font-size:11.5px;color:var(--ink-3);flex:1;line-height:1.5}
.tk .mt{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;display:flex;flex-direction:column;gap:3px}
.tk .mt div{display:flex;justify-content:space-between}
.tk .mt .k{color:var(--ink-3)}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wa{background:var(--auto-soft);color:var(--auto)}

/* ---------- signature ---------- */
.sig-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.sig-h{padding:8px 13px;background:var(--line-2);font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
canvas.pad{display:block;width:100%;height:170px;cursor:crosshair;touch-action:none;background:repeating-linear-gradient(0deg,#fff,#fff 41px,#F0F4F7 41px,#F0F4F7 42px)}
.sig-f{padding:8px 13px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line-2)}
.stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-top:13px}
.stamp{border:1px solid var(--line);border-radius:var(--r);padding:11px;text-align:center;background:#fff;position:relative;min-height:112px;display:flex;flex-direction:column}
.stamp .dn{font-size:11px;color:var(--ink-3);margin-bottom:7px;font-weight:600}
.stamp .box{flex:1;border:1px dashed var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3);overflow:hidden;background:#FCFDFE}
.stamp img{max-width:100%;max-height:52px}
.stamp .mode{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;padding:1.5px 8px;border-radius:9px;white-space:nowrap}
.stamp .mode.first{background:var(--brand);color:#fff}
.stamp .mode.copy{background:var(--auto);color:#fff}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-9deg);opacity:0}60%{transform:scale(.94) rotate(1.5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.stamped{animation:stampIn .42s cubic-bezier(.3,1.5,.5,1) forwards}

/* ---------- phone ---------- */
.phone{max-width:344px;margin:0 auto;border:9px solid var(--ink);border-radius:26px;background:#fff;overflow:hidden;box-shadow:0 10px 34px rgba(14,27,42,.17)}
.phone .nb{height:19px;background:var(--ink);position:relative}
.phone .nb::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;width:88px;height:15px;background:var(--ink);border-radius:0 0 9px 9px}
.phone .sc{padding:17px;min-height:400px}
.phone .lg{font-size:12.5px;font-weight:700;color:var(--brand);text-align:center;padding-bottom:11px;border-bottom:1px solid var(--line-2);margin-bottom:14px;letter-spacing:.03em}
.otp{display:flex;gap:7px;justify-content:center;margin:15px 0}
.otp i{width:36px;height:44px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:19px;font-weight:700;font-style:normal;background:#FAFCFD}
.otp i.f{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:22px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mini-doc{border:1px solid var(--line);border-radius:4px;padding:10px;font-size:10.5px;max-height:150px;overflow-y:auto;background:#FAFCFD;line-height:1.7;color:var(--ink-2)}
.mini-doc h5{font-size:11px;margin-bottom:5px;color:var(--ink)}

/* ---------- ipad ---------- */
.ipad{max-width:700px;margin:0 auto;border:13px solid var(--ink);border-radius:17px;background:#fff;overflow:hidden;box-shadow:0 12px 38px rgba(14,27,42,.19)}
.ipad .sc{padding:19px}

/* ---------- queue ---------- */
.qrow{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:9px}
.qrow .id{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.qrow .nmm{font-weight:600}
.qrow .meta{font-size:11.5px;color:var(--ink-3)}
.qrow .sp{flex:1}
.docpk{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}
@media(max-width:760px){.docpk{grid-template-columns:repeat(2,1fr)}}
.dcard{border:1px solid var(--line);border-radius:var(--r);padding:11px;font-size:11.5px;background:#fff}
.dcard .n{font-weight:700;font-size:12px;margin-bottom:5px;line-height:1.3}
.dcard .s{color:var(--ok);font-size:11px;display:flex;align-items:center;gap:4px}
.dcard .s.w{color:var(--auto)}
.ck{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.ck:last-child{border:none}
.ck .m{color:var(--ok);font-weight:700;flex-shrink:0;font-family:var(--mono)}
.ck .m.x{color:var(--bad)}


/* ---------- 紙本文件 ---------- */
.papers{background:#5A6472;padding:16px;border-radius:var(--r)}
.paper{background:#fff;width:100%;max-width:794px;margin:0 auto 14px;padding:20px 24px;color:#000;
  font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;font-size:10.5px;line-height:1.5;
  box-shadow:0 3px 14px rgba(0,0,0,.3);box-sizing:border-box}
.paper table{border-collapse:collapse;width:100%;font-size:9.5px;line-height:1.35}
.paper td,.paper th{border:1px solid #000;padding:2px 4px;vertical-align:top}
.paper td.n{border:none;padding:1px 2px}
.paper .lbl{background:#F0F0F0;white-space:nowrap;font-size:9px}
.paper .ttl{text-align:center;font-size:16px;font-weight:700;letter-spacing:.08em;margin:6px 0 4px}
.paper .co{text-align:center;font-size:13px;font-weight:700;letter-spacing:.04em}
.paper .sub{text-align:center;font-size:8.5px;color:#333;margin-bottom:6px}
.paper .red{color:#C00000}
.paper .warn{color:#C00000;font-size:8px;line-height:1.5;border:1px solid #C00000;padding:4px 6px;margin:5px 0}
.paper .fine{font-size:7.8px;line-height:1.55;color:#111}
.paper .sig{height:34px;position:relative}
.paper .sig img{position:absolute;left:6px;bottom:2px;height:30px}
.paper .qr{width:52px;height:52px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/9px 9px;border:2px solid #000}
.paper .barcode{height:34px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 9px);margin:3px 0}
.paper .barcode.thin{height:24px;background:repeating-linear-gradient(90deg,#000 0 1px,#fff 1px 3px,#000 3px 5px,#fff 5px 7px)}
.cmp-best{background:#E7F4EF!important;font-weight:700;color:var(--ok)}
.cmp-tot{background:var(--ink);color:#fff}
.cmp-tot td{border-color:#33475C}
.cmp-win{background:#177A5B!important;color:#fff;font-weight:700}
.backbtn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;font-size:11.5px;
  border:1px solid var(--line);border-radius:var(--r);color:var(--ink-2);background:#fff}
.backbtn:hover{border-color:var(--brand);color:var(--brand)}
.backbtn:disabled{opacity:.35;cursor:not-allowed}
@media print{
  .topbar,.rail,.nav,.acts,.note,.ph{display:none!important}
  body,#app,.wrap,.main{overflow:visible!important;height:auto!important;background:#fff!important}
  .papers{background:#fff;padding:0}
  .paper{box-shadow:none;width:auto;page-break-after:always;margin:0}
  .card{border:none}
}


/* ---------- 證件樣板 ---------- */

/* 畫面層級的返回（同一狀態內的子步驟） */
function subBack(){
  if(ROLE!=='agent') return false;
  if(C.screen==='docs'){ C.screen='new'; C.docsGen=false; return true; }
  if(C.screen==='cmppdf'){ C.screen='new'; return true; }

  if(C.screen==='plan' && !C.status){ C.screen='new'; return true; }
  if(C.status==='wait_cust' && C.track){ C.track=null; clearCustSig();
    C.uploaded=false; C.midVerified=false; midStep=0; return true; }
  return false;
}
function canBack(){
  if(ROLE!=='agent') return false;
  if(C.screen==='login') return false;
  if(['docs','cmppdf'].includes(C.screen)) return true;
  if(C.screen==='plan' && !C.status) return true;
  if(C.status==='wait_cust' && C.track) return true;
  return !!BACKMAP[C.status];
}
function back(){
  if(!canBack()) return;
  if(subBack()) return render();
  const b=BACKMAP[C.status]; if(!b) return;
  b.fix(); C.rejected=false; C.status=typeof b.to==='function'?b.to():b.to; C.screen=b.sc; render();
}
function drawBack(){
  const w=$('backwrap'); if(!w) return;
  const lbl = C.status ? ('上一步：'+(BACKMAP[C.status]?STATUS[idx(typeof BACKMAP[C.status].to==='function'?BACKMAP[C.status].to():BACKMAP[C.status].to)].n:'返回')) : '上一步';
  w.innerHTML = canBack()
    ? `<button class="backbtn" onclick="back()">← ${['docs','cmppdf'].includes(C.screen)||(C.status==='wait_cust'&&C.track)?'上一步':lbl}</button>`
    : `<button class="backbtn" disabled>← 上一步</button>`;
}

/* 引擎執行動畫 */
async function runEngine(el, badge, name, lines, total){
  el.innerHTML = `<div class="eng">
    <div class="eng-h"><span class="badge">${badge}</span><span class="nm">${name}</span><span class="st" id="est">執行中…</span></div>
    <div class="bar"><i id="ebar"></i></div>
    <div class="log" id="elog"></div>
  </div>`;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  const log=$('elog'), bar=$('ebar'), st=$('est');
  const step = total/lines.length;
  for(let i=0;i<lines.length;i++){
    const L=lines[i];
    const d=document.createElement('div');
    d.className='ln'+(L.ok?' ok':'');
    d.innerHTML=`<span class="t">${(step*(i+1)).toFixed(1)}s</span>${L.who?`<span class="who">${L.who}</span>`:''}<span class="m">${L.m}</span>`;
    log.appendChild(d); log.scrollTop=log.scrollHeight;
    bar.style.width=((i+1)/lines.length*100)+'%';
    await wait(L.w||340);
  }
  st.textContent='完成 · '+total+'s';
  st.style.color='var(--ok)';
  return true;
}

/* 簽名板 */
let padCtx=null, padDrawn=false;
function initPad(id){
  const cv=$(id); if(!cv) return;
  const r=cv.getBoundingClientRect();
  cv.width=r.width*2; cv.height=r.height*2;
  const x=cv.getContext('2d');
  x.scale(2,2); x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#132C4C';
  padCtx=x; padDrawn=false;
  let down=false;
  const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};
  const start=e=>{e.preventDefault();down=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);};
  const move=e=>{if(!down)return;e.preventDefault();const[a,b]=pos(e);x.lineTo(a,b);x.stroke();padDrawn=true;
    const bt=$('padOk'); if(bt) bt.disabled=false;};
  const end=()=>{down=false;};
  cv.onmousedown=start; cv.onmousemove=move; window.onmouseup=end;
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function clearPad(id){
  const cv=$(id); if(!cv||!padCtx) return;
  padCtx.clearRect(0,0,cv.width,cv.height); padDrawn=false;
  const bt=$('padOk'); if(bt) bt.disabled=true;
}
function grabPad(id){ const cv=$(id); return cv?cv.toDataURL():null; }

function setEff(which,k,v){
  if(which==='C'){
    const before = isAligned();
    C.effC[k]=+v;

    clampOpt();
  } else {

  }

  render();
}

function clampOpt(){
  const lo=toDate(compStart()), hi=toDate(compEnd()), cur=toDate(C.effO);
  if(cur<lo)  C.effO={...compStart()};
  if(cur>=hi){ const d=new Date(hi); d.setDate(d.getDate()-1); C.effO=fromDate(d); }
}

  sel.forEach(x=>steps.push({who:x.co,m:'試算完成',ok:true,w:220+Math.floor(Math.random()*60)}));

  await runEngine(el,'自動化','開始報價',steps,60);
  C.quotes=calcQuotes(); await wait(320);
  C.screen='new'; setStatus('quoted');
}

function stampGrid(who){
  const img=C.sig[who];
  const L = who==='cust'
    ? [['要保書 · 要保人簽章','首次'],['要保書 · 被保險人簽章','用印'],
       ['書面分析報告書 · 要保人簽章','用印'],['書面分析報告書 · 被保險人簽章','用印']]
    : who==='agent'
    ? [['要保書 · 招攬人員簽章','首次'],['書面分析報告書 · 招攬人員簽章','用印'],['業務員報告書 · 招攬人員簽章','用印']]
    : [['要保書 · 公司檢核章','首次'],['業務員報告書 · 公司檢核章','用印']];
  return `<div class="stamps">${L.map((d,i)=>`
    <div class="stamp">
      <span class="mode ${i===0?'first':'copy'}">${d[1]}</span>
      <div class="dn">${d[0]}</div>
      <div class="box">${img?`<img src="${img}" class="stamped" style="animation-delay:${i*.16}s;${img===HQ_SEAL?'max-height:64px':''}">`:'待簽名'}</div>
    </div>`).join('')}</div>`;
}
/* 直接寫入簽章影像（供無畫布環境使用，例如自動化測試） */
async function forceSig(who,data){
  C.sig[who]=data||"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>";
  if(who==='hq'){ C.hqSigned=true; C.hqSealMode='seal'; }
  render();
  if(who==='kyc_agent' && C.track!=='A'){
    await finishSigningAndCheck();
  }
}
async function saveSig(who,pad){
  if(!padDrawn) return;
  C.sig[who]=grabPad(pad);
  if(who==='hq'){ C.hqSigned=true; C.hqSealMode='seal'; }
  render();
  /* 業務員簽完最後一個簽名欄位（業務員報告書）後，數位軌道立即同步啟動 OCR 檢查，
     避免延後到「上傳錠嵂系統前」才確認：屆時客戶已離場或線上簽署已結束，發現錯誤將難以即時重簽。 */
  if(who==='kyc_agent' && C.track!=='A'){
    await finishSigningAndCheck();
  }
}

function anaLine(col,top,text,fs){
  const x = col==='L' ? 4 : 51, w = col==='L' ? 45.5 : 46;
  return `<div style="position:absolute;left:${x}%;top:${top}%;width:${w}%;font-size:${fs||10.5}px;
    font-family:'Microsoft JhengHei',sans-serif;color:#000;line-height:1.3;background:#fff;padding:1px 2px">${text}</div>`;
}
function anaField(left,top,text,opt){
  opt = opt || {};

    font-family:'Microsoft JhengHei',sans-serif;color:#000;white-space:nowrap;line-height:1.3;
    background:#fff;padding:1px 2px 1px 1px;
    ${opt.bw?'width:'+opt.bw+'px;overflow:hidden;':(opt.mw?'max-width:'+opt.mw+'px;overflow:hidden;text-overflow:ellipsis;':'')}
    ${opt.h?'height:'+opt.h+'px;display:flex;align-items:center':''}">${text||''}</div>`;
}
function anaSig(left,top,who,h){

    <img src="${v}" style="height:${h}px${v===HQ_SEAL?';opacity:.85':''}"></div>`;

      ${seg('是否具辨識不利投保權益能力（65歲以上適用）','ability65',ANA2.ABILITY65)}
    </div>
    ${A.hasOtherPolicy===0?`<div class="f" style="max-width:340px;margin-bottom:11px">
      <label>其他有效保險契約之保險公司（業務員登打）<span class="req">*</span></label>
      <input value="${A.otherPolicyCo}" oninput="C.ana2.otherPolicyCo=this.value" onkeydown="if(event.key==='Enter'){this.blur()}" onchange="C.ana2.otherPolicyCo=this.value;C.analysisDone=false;render()" placeholder="請輸入保險公司名稱"></div>`:''}
    <div class="fine" style="margin:-3px 0 13px">要保人風險屬性（投資型或外幣商品適用）、被保險人旅行平安險重複投保（旅平險商品適用）：車險不適用，維持原始表單空白。</div>

    <div class="sec-lbl" style="margin-bottom:9px;color:var(--brand)">經紀人／業務員建議事項</div>
    <div class="fine" style="margin:0 0 11px">保險公司名稱、保險費：依已選定之投保方案自動帶入。主契約繳費年期：車險固定 1 年，系統自動帶入。</div>
    <div class="row" style="margin-bottom:11px">
      ${seg('保險公司概況查詢方式','refSrc',ANA2.REFSRC)}
      ${seg('保障範圍來源','scopeSrc',ANA2.SCOPESRC)}
    </div>
    ${seg('保險商品·險種名稱','productDesc',ANA2.PRODUCTDESC)}
    ${seg('保障範圍及保險金額','scopeDesc',ANA2.PRODUCTDESC)}
    <div class="fine" style="margin:-3px 0 11px">保險條款及審閱期：僅「依保險公司提供說明」一個選項，系統固定勾選。</div>
    ${seg('建議投保保險公司之理由','reason',ANA2.REASON)}

    <div class="acts"><button class="btn o sm" onclick="resetAna2()">還原預設值</button></div>
  </div></div>`;
}
function setAna2(k,i){ C.ana2[k]=i; C.analysisDone=false; render(); }
function resetAna2(){
  C.ana2={ currency:0, payType:1, fundSrc:0, retireYears:2, purpose:0, assignInsurer:0,
           hasOtherPolicy:0, otherPolicyCo:'', ability65:1, refSrc:0, productDesc:1, scopeDesc:1, scopeSrc:0, reason:0 };
  C.analysisDone=false; render();
}

/* ============================================================
   畫面：要保人
   ============================================================ */
let midStep=0;
function scCust(){
  if(!C.status || idx(C.status)<idx('built')) return `<div class="card"><div class="bd"><div class="empty"><div class="ic">▤</div><h3>目前沒有待處理的投保案件</h3><p>請由業務員發送簽署連結</p></div></div></div>`;
  if(C.track!=='C') return `<div class="card"><div class="bd"><div class="empty"><div class="ic">▤</div><h3>本案採用軌道 ${C.track||'—'}</h3><p>${C.track==='B'?'請於業務員的行動投保介面完成簽名':C.track==='A'?'請於紙本文件上簽名後回傳':'業務員尚未選擇簽署方式'}</p></div></div></div>`;
  const q=QQ()[C.pick];
  return ph('階段 3 · 軌道 C','要保人手機端','MID 電信認證身分核對') + `
  <div class="phone"><div class="nb"></div><div class="sc">
    <div class="lg">錠嵂保險經紀人</div>
    ${midStep===0?`
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">您有一份投保文件待確認</div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-bottom:13px">案件 ${C.no}</div>
      <dl class="kv" style="margin-bottom:13px"><dt>承保公司</dt><dd>${q.co}</dd><dt>車牌</dt><dd>${CAR.plate}</dd><dt>年繳保費</dt><dd>NT$ ${nt(q.tot)}</dd></dl>
      <div class="mini-doc" style="margin-bottom:14px"><h5>文件包（4 份）</h5>
        1. 要保書<br>2. 三合一繳費文件<br>3. 業務員報告書 KYC<br>4. 書面分析報告<br>
        <div style="margin-top:7px;color:var(--ink-3)">請向下捲動閱讀完畢後進行身分驗證。</div></div>
      <button class="btn" style="width:100%" onclick="midStep=1;render()">我已閱讀，進行身分驗證</button>`
    :midStep===1?`
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">MID 行動身分識別</div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-bottom:9px">請確認您的門號</div>
      <div class="f"><label>手機號碼<span class="req">*</span></label><input value="${PERSON.phone}" readonly></div>
      <div class="f"><label>電信業者<span class="req">*</span></label><input value="中華電信" readonly></div>
      <button class="btn" style="width:100%;margin-top:6px" onclick="midStep=2;render();setTimeout(()=>{midStep=3;render()},1800)">傳送認證請求</button>`
    :midStep===2?`
      <div class="spin"></div>
      <div style="text-align:center;font-size:12.5px;color:var(--ink-3);line-height:1.8">正在與電信業者核對身分…<br>請於手機上確認 Mobile ID 通知</div>`
    :midStep===3?`
      <div style="font-size:13px;font-weight:700;margin-bottom:9px">請輸入驗證碼</div>
      <div class="otp"><i class="f">4</i><i class="f">7</i><i class="f">2</i><i class="f">9</i></div>
      <div style="text-align:center;font-size:11.5px;color:var(--ink-3);margin-bottom:14px">已自動填入（POC 模擬）</div>
      <button class="btn" style="width:100%" onclick="midOk()">確認</button>`
    :`
      <div style="text-align:center;padding:22px 0">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 13px">✓</div>
        <div style="font-size:14px;font-weight:700;margin-bottom:5px">身分驗證完成</div>
        <div style="font-size:12px;color:var(--ink-3);line-height:1.75">已由中華電信完成實名核對<br>身分核對完成，請接續完成簽名</div>
        <div style="font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:11px">MID-8842-771093</div>
      </div>
      <button class="btn o" style="width:100%" onclick="setRole('agent')">返回業務員視角</button>`}
  </div></div>`;
}
function midOk(){ midStep=4; C.midVerified=true; render(); }

/* ============================================================
   畫面：公司管理部用印公司電子檢核章
   ============================================================ */
function scDoc(){
  if(C.pick===null || !C.no) return ph('階段 4 · 檢核章用印','文件檢視','')+
    `<div class="card"><div class="bd"><div class="empty"><div class="ic">▤</div>
      <h3>尚無可檢視的案件</h3><p>請自「保單總覽」開啟案件</p>
      <button class="btn" style="margin-top:14px" onclick="go('home')">回保單總覽</button></div></div></div>`;
  const q=QQ()[C.pick];
  const CK=[
    ['要保書 — 要保人簽名、被保險人簽名',true],
    ['業務員報告書 KYC — 招攬人員簽章',true],
    ['書面分析報告書 — 聲明事項 15 題全數填答',true],
    ['車籍資料與要保書一致性',true],
    ['業務員上傳前自動檢查結果',true]
  ];
  return ph('階段 4 · 檢核章用印','文件檢視與電子用印',
    '案件 '+C.no+'　·　'+(C.sentBy||'錠嵂 業務員')+'　·　'+(C.sentAt||'')) + `
  <div class="card"><h2>已簽署文件包 <span class="tag">軌道 ${C.track}${C.track==='A'?' · 紙本掃描件':''}</span></h2><div class="bd">
    <div class="note b">三份文件於下方一頁呈現，往下拉即可逐份檢視，確認無誤後交由公司管理部用印公司電子檢核章。</div>
    <div class="docpk" style="grid-template-columns:repeat(3,1fr);margin-top:12px">
      <div class="dcard" style="cursor:pointer" onclick="jumpDoc('h-app')"><div class="n">① 要保書</div><div class="s">✓ 2 欄已簽</div></div>
      <div class="dcard" style="cursor:pointer" onclick="jumpDoc('h-kyc')"><div class="n">② 業務員報告書 KYC</div><div class="s">✓ 1 欄已簽</div></div>
      <div class="dcard" style="cursor:pointer" onclick="jumpDoc('h-ana')"><div class="n">③ 書面分析報告書</div><div class="s">✓ 內容已核對</div></div>
    </div>
    <div class="sec-lbl">系統自動檢核</div>
    ${CK.map(c=>`<div class="ck"><span class="m ${c[1]?'':'x'}">${c[1]?'✓':'✗'}</span><span>${c[0]}</span></div>`).join('')}
    
  </div></div>
  <div class="card"><h2>公司檢核章 <span class="tag">套用於 3 份文件</span></h2><div class="bd">
    ${C.hqSigned?`
      <div class="note k">✓ 公司檢核用印完成（電子印章 · 公司管理部用印）</div>
      ${stampGrid('hq')}
      <div class="acts"><button class="btn g" onclick="hqPass()">用印完成，送件至產險公司</button>
        <button class="btn o sm" onclick="C.hqSigned=false;C.sig.hq=null;C.hqSealMode=null;render()">重新用印</button></div>
    `:`
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:18px;background:#fff">
      <img src="${HQ_SEAL}" style="width:112px;height:112px;opacity:.9">
      <div style="flex:1;min-width:220px">
        <div style="font-size:13.5px;font-weight:700;margin-bottom:3px">錠嵂保險經紀人股份有限公司</div>
        <div style="font-size:12px;color:var(--ink-3);margin-bottom:11px">公司檢核章　·　電子印鑑檔　·　公司管理部保管用印</div>
        <button class="btn" onclick="applySeal()">用印電子印章至 3 份文件</button>
      </div>
    </div>`}
  </div></div>

  <div class="docsec" id="h-app"><div class="docsec-h">① 要保書</div><div class="papers">${docApp(q)}</div></div>
  <div class="docsec" id="h-kyc"><div class="docsec-h">② 業務員報告書 KYC</div><div class="papers">${docKyc(q)}</div></div>
  <div class="docsec" id="h-ana"><div class="docsec-h">③ 書面分析報告書</div><div class="papers">${docAnalysis(q)}</div></div>
  <div class="bottombar" id="h-bottom">
    <div class="lead">${C.hqSigned?'檢核用印已完成':'三份文件檢視完畢'}
      <span>${C.hqSigned?'可送件至產險公司':'確認無誤請用印電子印章'}</span></div>
    <button class="btn o sm" onclick="jumpDoc('h-app')">↑ 回到第一份</button>
    ${C.hqSigned
      ? `<button class="btn g" onclick="hqPass()">用印完成，送件至產險公司</button>`
      : `<button class="btn" onclick="applySeal()">用印電子印章至 3 份文件</button>`}
  </div>`;
}
function applySeal(){ C.sig.hq=HQ_SEAL; C.hqSigned=true; C.hqSealMode='seal'; render(); }
function hqPass(){ setStatus('hq_done'); C.screen='new'; render(); }

function scHQDone(){
  const ok = idx(C.status||'quote_in')>=idx('hq_done');
  if(!ok) return ph('已簽署案件','已簽署案件','')+`<div class="card"><div class="bd"><div class="empty"><div class="ic">✓</div><h3>尚無已簽署案件</h3></div></div></div>`;
  return ph('已簽署案件','已簽署案件','')+`<div class="card"><div class="bd" style="padding:12px">
    <div class="qrow" style="margin:0"><span class="id">${C.no}</span>
    <div><div class="nmm">${PERSON.name}</div><div class="meta">${CAR.plate} · 軌道 ${C.track}</div></div>
    <div class="sp"></div><span class="pill ok">${STATUS[idx(C.status)].n}</span></div>
  </div></div>`;
}

/* ============================================================
   Render
   ============================================================ */
let LAST_VIEW_KEY = null;
function render(){
  drawRail(); drawNav(); drawBack();
  const S=C.screen;
  let h='';
  if(ROLE==='agent'){
    if(S==='login') h=scLogin();
    else if(S==='home') h=scHome();
    else if(S==='new') h=scNew();
    else if(S==='plan') h=scPlan();
    else if(S==='cmppdf') h=scCmpPdf();
    else if(S==='docs') h=scDocsPreview();
    else if(S==='search') h=scSearch();
    else if(S==='msg') h=scMsg();
    else if(S==='tools') h=scTools();
    else if(S==='doc') h=scDoc();
    else h=scHome();
  } else { h=scCust(); }
  $('view').innerHTML=h;
  ['padCust','padAgent'].forEach(p=>{ if($(p)) initPad(p); });
  /* 僅在「畫面身分」真正切換時才捲回頂部；同一畫面內的欄位調整、勾選等狀態更新不重置捲動位置 */
  const key = ROLE+'|'+S+'|'+(C.status||'')+'|'+(C.track||'');
  if(key!==LAST_VIEW_KEY){ $('view').parentElement.scrollTop=0; LAST_VIEW_KEY=key; }
}
reset();
</script>
</body>
</html>
